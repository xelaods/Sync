name: Sync

options:
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"

targets:
  Sync:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.personal.sync
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Sync
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO

schemes:
  Sync:
    build:
      targets:
        Sync: all
