workflows:
  ios-signed-ipa:
    name: iOS Signed IPA
    max_build_duration: 60
    environment:
      xcode: latest
      groups:
        - signing
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Set up code signing profiles
        script: |
          xcode-project use-profiles --project Sync.xcodeproj

      - name: Build signed IPA
        script: |
          xcode-project build-ipa \
            --project Sync.xcodeproj \
            --scheme Sync \
            --config Release
    
    artifacts:
      - build/ios/ipa/*.ipa
