workflows:
  ios-compile-check:
    name: iOS Compile Check
    max_build_duration: 60
    environment:
      xcode: latest
    triggering:
      events:
        - push
      branch: main
    scripts:
      - name: Install XcodeGen
        script: |
          brew install xcodegen

      - name: Generate Xcode project
        script: |
          xcodegen generate

      - name: Build without code signing
        script: |
          xcodebuild \
            -project Sync.xcodeproj \
            -scheme Sync \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build
